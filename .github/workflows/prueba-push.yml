name: prueba-push
on:
  push:
    branches: ['zz-*']
  create:
permissions:
  contents: read
jobs:
  eco:
    if: github.event_name == 'push' || startsWith(github.event.ref, 'zz-')
    runs-on: ubuntu-latest
    steps:
      - run: echo "event ${{ github.event_name }} ref ${{ github.ref }} actor ${{ github.actor }}"
